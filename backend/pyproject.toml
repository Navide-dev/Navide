[project]
name = "agent-team-backend"
version = "0.2.19"
description = "Python backend for the Navide AI-native engineering environment"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    # Trust roots for the outbound Navide-Server link (server_link.py imports
    # it directly). Transitive via httpx/anthropic already, but a frozen build
    # has no other CA store it can find, so its presence must not be a side
    # effect of somebody else's dependency tree.
    "certifi",
    "chardet>=7.4.3",
    # Imported directly by device_crypto.py, device_signing.py and
    # sync_keyring.py (X25519/HKDF/AES-GCM and Ed25519 for the cross-device
    # link), so it is declared here instead of arriving through
    # mcp -> pyjwt[crypto].
    "cryptography",
    # Windows on Arm is held at the last release that published a win_arm64
    # wheel: pyca stopped building them in 46.0.4 because the arm64 Actions
    # image was too unreliable to release from (pyca/cryptography#14216), and
    # building the sdist would put a Rust + OpenSSL toolchain in the release
    # path. Lift this pin as soon as upstream ships win_arm64 wheels again.
    # Every advisory against 46.0.3 sits in code this backend never calls
    # (X.509 verification, PKCS#7/CMS, the `ec` module); any future use of
    # those lands on the vulnerable version on Windows on Arm first.
    "cryptography==46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "fastapi>=0.115",
    "mammoth>=1.12.0",
    # Pinned below 2.0: 1.28.1 carries the PYSEC-2026-3481/3482/3483 fixes,
    # while 2.x is a breaking FastMCP rewrite that mcp_server/server.py has not
    # been migrated to.
    "mcp>=1.28.1,<2",
    "openpyxl>=3.1.5",
    # Process-tree walking and per-process counters for the Windows
    # implementation of osplat.process_tree / resource_probe (psutil has
    # binary wheels for every platform the backend ships on, so it costs the
    # POSIX builds nothing to carry). osplat/_windows.py imports it, and
    # osplat/cli_network.py for CLI risk process names on every platform.
    "psutil>=7",
    # ConPTY bindings for osplat/_windows.py's terminal backend. Windows-only
    # wheels, so the marker keeps macOS/Linux resolution and PyInstaller
    # builds from ever looking for it.
    "pywinpty>=3.0; sys_platform == 'win32'",
    "pyyaml>=6.0",
    "send2trash>=2.1.0",
    # TOML serialisation for the pane shims. tomllib reads (stdlib since 3.11)
    # but has no writer, and grok's MCP servers live in its config.toml — the
    # shim re-emits that whole document, so a hand-rolled emitter would have
    # to round-trip the user's own settings.
    "tomli-w>=1.0",
    # Windows has no system tz database; zoneinfo needs the package there.
    "tzdata; sys_platform == 'win32'",
    "uvicorn[standard]>=0.32",
    "watchdog>=4.0",
    # Outbound WebSocket client for the Navide-Server link (server_link.py).
    # It already arrives as a transitive dependency of uvicorn[standard], but
    # that makes its presence and version a side effect of uvicorn's extras —
    # declared here because we import it directly. >=14 is where
    # `websockets.connect` became the asyncio client this module uses.
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Per-test deadline for the Windows CI job: a hang there must fail with a
    # traceback instead of eating the whole job timeout in silence.
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_team_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "cli_regression: deterministic CLI infrastructure and vendor contracts",
    "cli_shared: shared CLI process, transport, lifecycle and session contracts",
    "cli_vendor: vendor-specific integration contracts",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Guardrail, not a style linter (issue #2): the backend is one asyncio event
# loop over one WebSocket, so a single blocking call inside an async function
# stalls every terminal in the app. ASYNC rules flag blocking calls
# (subprocess, sleep, open, ...) inside `async def` — offload them via
# asyncio.to_thread / run_in_executor instead.
#
# F821 (undefined name) rides along for the same reason: it is not style
# either. v0.1.88 shipped `NameError: codex_command_with_resume_id` — a missing
# import on the terminal.create path that no test covered, because it only
# fires when a codex pane actually spawns. F821 catches that class at lint
# time; the release gates run this check before building.
select = ["ASYNC", "F821"]
ignore = [
    # Not freeze-class: fast pathlib metadata calls and timeout-param API
    # style. Keeping only the rules that catch event-loop stalls.
    "ASYNC109",
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# Tests block on purpose (subprocess fixtures inside async tests); each test
# runs its own short-lived loop, so nothing user-facing can stall.
"tests/**" = ["ASYNC"]
