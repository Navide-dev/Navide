# Example Compose deployment of the Official Registry behind a reverse proxy
# that routes https://server.navide.dev/registry/*, marketplace.navide.dev and
# developers.navide.dev to this container, paths unchanged.
# Copy next to the host's secrets and adjust paths; nothing here is a secret.
#
#   docker compose -f compose.example.yml up -d --build
services:
  navide-registry:
    build:
      context: ..            # marketplace/registry
    image: navide-registry:latest
    restart: unless-stopped
    ports:
      # Host port the load balancer target group points at.
      - "${REGISTRY_HOST_PORT:-8791}:8787"
    environment:
      REGISTRY_TRUST_PROFILE: official
      REGISTRY_TRUST_CONFIG_FILE: /etc/navide-registry/official-trust.json
      REGISTRY_ROOT_PATH: /registry
      # Host routing (README "Host routing"): the website on its own hosts,
      # the API kept on the legacy host under REGISTRY_ROOT_PATH.
      REGISTRY_STORE_ORIGIN: https://marketplace.navide.dev
      REGISTRY_DEVELOPER_ORIGIN: https://developers.navide.dev
      REGISTRY_LEGACY_HOSTS: server.navide.dev
      # Proxies whose X-Forwarded-Proto/-For uvicorn trusts (default "*": the
      # port is reachable only through the load balancer). Narrow to the
      # proxy's subnet if it is not.
      # REGISTRY_FORWARDED_ALLOW_IPS: "10.0.0.0/16"
      REGISTRY_ADMIN_TOKEN_FILE: /run/secrets/navide-registry-admin-token
      # Navide Cloud sign-in (Phase 2). Leave these four unset to keep
      # self-service publishing off.
      REGISTRY_AUTH_URL: https://forum.navide.dev/navide-auth
      REGISTRY_AUTH_RETURN_URL: https://server.navide.dev/registry/auth/callback
      REGISTRY_AUTH_SECRET_FILE: /run/secrets/navide-registry-auth-secret
      REGISTRY_SESSION_SECRET_FILE: /run/secrets/navide-registry-session-secret
      # Comma-separated Navide member ids allowed into /admin/review.
      REGISTRY_ADMIN_MEMBER_IDS: ""
    secrets:
      - navide-registry-root.pem
      - navide-registry-signer.pem
      - navide-registry-admin-token
      - navide-registry-auth-secret
      - navide-registry-session-secret
    volumes:
      - navide-registry-data:/data
      - ./official-trust.json:/etc/navide-registry/official-trust.json:ro
    tmpfs:
      # Owner-only copies of the private keys (see deploy/entrypoint.sh).
      - /run/navide-keys:uid=10001,gid=10001,mode=0700

secrets:
  # Compose file secrets are bind mounts that keep the host file's owner and
  # mode: make them readable by the container user (uid 10001), e.g.
  #   chown 10001:10001 <file> && chmod 0400 <file>
  navide-registry-root.pem:
    file: /srv/navide-registry/secrets/registry_root.key
  navide-registry-signer.pem:
    file: /srv/navide-registry/secrets/registry_signer.key
  navide-registry-admin-token:
    file: /srv/navide-registry/secrets/admin_token
  navide-registry-auth-secret:
    file: /srv/navide-registry/secrets/auth_secret
  navide-registry-session-secret:
    file: /srv/navide-registry/secrets/session_secret

volumes:
  navide-registry-data:
