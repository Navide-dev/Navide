# Dependency update proposals. Each PR still has to pass the full CI suite —
# nothing here merges on its own, and the repo's auto-commit hooks must not
# touch Dependabot branches.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # Majors escape the dev-tooling group and land as one PR each. These two
    # must not be bumped by a bot:
    ignore:
      # The whole toolchain is pinned to Node 22 (package.json engines,
      # CI and release workflows). @types/node has to track that major, or
      # typecheck starts accepting APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A vitest major is a breaking migration (v5 splits the browser
      # providers and narrows peer ranges). Do it deliberately, in its own
      # branch, with the full suite run — not from a bot PR.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # The MCP server is written against the 1.x FastMCP API; 2.x changes
      # tool registration and the stateless transport. Upgrade deliberately,
      # on its own branch, with the full suite — not from a bot PR (#59).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
