name: Secret scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action needs a paid GITLEAKS_LICENSE on organization repos, so
      # run the CLI it wraps directly: the same version it defaults to, the
      # same arguments, and the same commit range per event.
      - name: Install gitleaks
        env:
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan for secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(detect --redact -v --exit-code=2 --report-format=sarif
                --report-path=results.sarif --log-level=debug)
          case "$GITHUB_EVENT_NAME" in
            push)
              base=$(jq -r '.commits[0].id // empty' "$GITHUB_EVENT_PATH")
              head=$(jq -r '.commits[-1].id // empty' "$GITHUB_EVENT_PATH")
              if [ -z "$base" ]; then echo "No commits to scan"; exit 0; fi
              ;;
            pull_request)
              shas=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].sha')
              base=$(head -n1 <<<"$shas")
              head=$(tail -n1 <<<"$shas")
              ;;
          esac
          if [ -n "${base:-}" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$base" = "$head" ]; then
              args+=("--log-opts=-1")
            else
              args+=("--log-opts=--no-merges --first-parent ${base}^..${head}")
            fi
          fi
          set +e
          gitleaks "${args[@]}"
          code=$?
          set -e
          if [ -f results.sarif ]; then
            count=$(jq '[.runs[].results[]] | length' results.sarif)
            echo "Gitleaks ${GITLEAKS_VERSION}: ${count} finding(s)" >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$code" in
            0) echo "No leaks detected" ;;
            2) echo "::error::Gitleaks detected secrets"; exit 1 ;;
            *) echo "::error::Unexpected gitleaks exit code $code"; exit "$code" ;;
          esac

      - name: Upload results
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results.sarif
          path: results.sarif
