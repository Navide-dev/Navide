# Experiment only (exp/ci-hang-0243-*), never merged: loop the Windows shard
# window that stalled and save py-spy and cdb stacks of every stall.
name: Exp Windows stall loop

on:
  push:
    branches:
      - 'exp/ci-hang-0243-*'

permissions:
  contents: read

jobs:
  loop:
    name: Stall loop (${{ matrix.runner_no }})
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        runner_no: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv --project backend sync --locked
      - name: Stack tools
        shell: pwsh
        run: |
          uv tool install py-spy==0.4.2
          "NAVIDE_CI_PY_SPY=$(Join-Path $env:UV_TOOL_BIN_DIR 'py-spy.exe')" >> $env:GITHUB_ENV
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (Test-Path $cdb) { "NAVIDE_CI_CDB=$cdb" >> $env:GITHUB_ENV } else { Write-Host "cdb not found at $cdb" }
          backend/.venv/Scripts/python.exe -c "import importlib.metadata as m; print('pywinpty', m.version('pywinpty'))"
      - name: Loop
        run: backend/.venv/Scripts/python.exe scripts/exp-hang/hangloop.py 40
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exp-hang-${{ matrix.runner_no }}
          path: test-results/exp/
          retention-days: 7
