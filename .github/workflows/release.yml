name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger to dry-run the whole chain without publishing a release:
  # macOS builds, signs, notarizes and verifies; Linux and Windows build and
  # validate; the arm64 Linux job runs here and only here. Every one of them
  # attaches its installers as workflow artifacts, so a dry run still yields
  # something to download and try.
  #
  # A tag push never shows a partial release. The macOS job creates the GitHub
  # Release as a draft, every platform job uploads into that draft, the mirror
  # copies it to dl.navide.dev, and only then does publish-release flip it to
  # public and Latest. If any job fails the draft simply stays a draft: re-run
  # the failed jobs to finish it, or delete it (RELEASING.md, "After the tag
  # push").
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    # v0.1.40, v0.1.41, and v0.1.49 are manually published unsigned previews
    # (v0.1.49: signing private key unavailable at release time).
    if: github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    name: Test, sign, notarize, and release macOS arm64
    runs-on: macos-14
    timeout-minutes: 60
    environment:
      name: production
      url: https://github.com/Navide-dev/Navide/releases/latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        # Runs install, typecheck, test, build and electron-builder. The version
        # is pinned in .bun-version; the action pin is the one ci.yml uses.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up pnpm
        # Not for installing or building: src/main/plugins/pluginExternalWorkspace.test.ts
        # drives a third-party plugin workspace with pnpm-specific flags and needs
        # the binary. pnpm comes from packageManager; no cache.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        # Only for the plain `node scripts/...` and `node -p` steps below, which
        # are release checks and post-processing outside package.json. Everything
        # started through `bun run` runs on Bun itself (bunfig.toml [run] bun).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked

      - name: Verify tag and version sources
        if: github.event_name == 'push'
        run: bun run release:check "${GITHUB_REF_NAME}"

      - name: Run release gates
        env:
          # Added when vue-tsc on tsconfig.web.json outgrew Node's default ~2 GB
          # heap here (OOM, exit 134). These `bun run` commands now run on Bun
          # (bunfig.toml `[run] bun = true`), where this V8 heap flag most
          # likely has no effect; it stays for anything that still starts a
          # real Node.js, matching CI's test jobs.
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          uv --project backend run --locked ruff check backend
          bun run typecheck
          bun run test:run
          bun run test:packaged-plans
          uv --project backend run --locked pytest backend/tests

      - name: Build Python backend
        working-directory: backend
        run: uv run --locked pyinstaller agent_team_backend.spec

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/navide-stt

      - name: Build speech-to-text sidecar
        # Compiles whisper.cpp (cmake) into build/stt/, which electron-builder
        # packages as bin/navide-stt. Required here: a release without it silently
        # loses voice input.
        shell: bash
        env:
          NAVIDE_STT_REQUIRED: '1'
        run: bun run build:stt

      - name: Build, sign & notarize application
        shell: bash
        run: |
          bun run build
          test -f dist-plugins/plans/index.html
          test ! -e dist-plugins/plans/backend/navide-plans
          test ! -e dist-plugins/plans/backend/navide-plans-go
          # The packaged Plans backend is what electron-builder is about to sign
          # into the release. Verify it before the expensive sign/notarize leg:
          # a build that produced no backend ships a release whose Plans starts
          # in legacy recovery for every user, and nothing else here notices.
          node scripts/verify-plans-production.mjs
          # hdiutil on shared macOS runners intermittently fails to attach the
          # DMG staging image ("Device not configured"); retry absorbs it.
          for attempt in 1 2 3; do
            if bun run electron-builder --mac --arm64 --publish never; then
              exit 0
            fi
            echo "electron-builder attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          echo "electron-builder failed after 3 attempts"
          exit 1
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Developer ID signing (electron-builder imports the base64 .p12).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization credentials (mac.notarize: true in package.json).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature & notarization
        shell: bash
        run: |
          app_path="$(find dist-release -maxdepth 2 -name '*.app' -type d -print -quit)"
          test -n "${app_path}"
          test ! -e "${app_path}/Contents/Resources/plugins/plans/backend/navide-plans"
          test ! -e "${app_path}/Contents/Resources/plugins/plans/backend/navide-plans-go"
          # …and the exact selected v2 factory package carries its arm64 backend.
          artifact_version="$(node -p "require('./package.json').version")"
          test -x "${app_path}/Contents/Resources/official-artifacts/navide.plans/${artifact_version}/darwin-arm64/package/backend/navide-plans"
          # The voice sidecar is a loose Mach-O in Resources/bin; it must carry
          # the Developer ID signature with the hardened runtime flag.
          stt_bin="${app_path}/Contents/Resources/bin/navide-stt"
          test -x "${stt_bin}"
          codesign --verify --strict --verbose=2 "${stt_bin}"
          codesign --display --verbose=2 "${stt_bin}" 2>&1 | grep -q 'flags=.*runtime'
          echo "Verifying ${app_path}"
          # Signed with a valid Developer ID and the seal is intact.
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign --display --verbose=2 "${app_path}"
          # Gatekeeper accepts it for execution (requires notarization).
          spctl --assess --type execute --verbose=2 "${app_path}"
          # The notarization ticket is stapled to the app.
          stapler validate "${app_path}"

      - name: Repackage macOS update zip (preserve framework symlinks)
        # electron-builder 26.15.0's zip target flattens the Electron Framework
        # symlinks, so Squirrel.Mac rejects the extracted app during auto-update
        # with "bundle format is ambiguous (could be app or framework)". Re-zip the
        # signed + notarized .app with ditto (which keeps the symlinks) and refresh
        # latest-mac.yml's sha512/size to match.
        shell: bash
        run: node scripts/fix-mac-update-zip.mjs dist-release

      - name: Validate update artifacts
        shell: bash
        run: |
          test -f dist-release/latest-mac.yml
          test "$(find dist-release -maxdepth 1 -name 'Navide-*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find dist-release -maxdepth 1 -name 'Navide-*.zip' | wc -l | tr -d ' ')" -eq 1
          test "$(find dist-release -maxdepth 1 -name '*.blockmap' | wc -l | tr -d ' ')" -ge 2
          app_path="$(find dist-release -maxdepth 2 -name '*.app' -type d -print -quit)"
          test -n "${app_path}"
          # Regression guard: the update zip must extract to a codesign-valid app.
          # electron-builder's raw zip fails this with "bundle format is ambiguous";
          # the ditto repackage step above is what makes it pass. This is the check
          # that was missing when the broken zip shipped.
          zip_path="$(find dist-release -maxdepth 1 -name 'Navide-*.zip' -print -quit)"
          work="$(mktemp -d)"
          ditto -x -k "${zip_path}" "${work}"
          extracted="$(find "${work}" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "${extracted}"
          codesign --verify --deep --strict --verbose=2 "${extracted}"
          rm -rf "${work}"

      - name: Attach installers to the workflow run
        # Every run, including a workflow_dispatch dry run: this is how a signed
        # and notarized macOS build gets tried on a real Mac before a tag
        # publishes it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navide-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-release/Navide-*.dmg
            dist-release/Navide-*.zip

      - name: Upload to the draft GitHub Release
        # Manual (workflow_dispatch) runs dry-run the signing chain only.
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(find dist-release -maxdepth 1 -type f \( -name 'Navide-*.dmg' -o -name 'Navide-*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) -print0)
          test "${#assets[@]}" -ge 4
          # Creates the release as a draft; if it already exists (e.g. from a
          # rerun), uploads/replaces assets instead of failing.
          scripts/publish-release-assets.sh "${GITHUB_REF_NAME}" "${assets[@]}"

  release-linux-x64:
    if: github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    name: Package and release Linux x64
    # After macOS, not beside it: both jobs upload into the same draft GitHub
    # Release with an idempotent view-then-upload-or-create, and two jobs
    # racing to `gh release create` the same tag would lose one of them. The
    # macOS job creates the draft; this one joins its assets to it.
    needs: release-macos-arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://github.com/Navide-dev/Navide/releases/latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        # Runs install, typecheck, test, build and electron-builder. The version
        # is pinned in .bun-version; the action pin is the one ci.yml uses.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Node.js
        # Only for the plain `node scripts/...` and `node -p` steps below, which
        # are release checks and post-processing outside package.json. Everything
        # started through `bun run` runs on Bun itself (bunfig.toml [run] bun).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: release-linux

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked

      - name: Verify tag and version sources
        if: github.event_name == 'push'
        run: bun run release:check "${GITHUB_REF_NAME}"

      - name: Run Linux release gates
        # The frontend gates (typecheck, vitest, packaged-plans) are platform
        # independent and the macOS job this depends on has already passed
        # them. What is worth repeating here is everything that touches the
        # OS: the backend suite on this kernel, and the smoke test that opens
        # a real PTY, reads /proc, and serves /health — the things the suite
        # structurally cannot prove and that the port lives or dies by.
        run: |
          uv --project backend run --locked ruff check backend
          uv --project backend run --locked pytest backend/tests
          uv --project backend run --locked python backend/linux_smoke.py

      - name: Build Python backend
        # PyInstaller cannot cross-compile; this is the only place a Linux
        # backend binary is ever produced.
        working-directory: backend
        run: uv run --locked pyinstaller agent_team_backend.spec

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/navide-stt

      - name: Build speech-to-text sidecar
        # Compiles whisper.cpp (cmake) into build/stt/, which electron-builder
        # packages as bin/navide-stt. Required here: a release without it silently
        # loses voice input.
        shell: bash
        env:
          NAVIDE_STT_REQUIRED: '1'
        run: bun run build:stt

      - name: Build application
        shell: bash
        run: |
          bun run build
          test -f dist-plugins/plans/index.html
          test ! -e dist-plugins/plans/backend/navide-plans
          test ! -e dist-plugins/plans/backend/navide-plans-go
          node scripts/verify-plans-production.mjs
          # No signing on Linux: neither AppImage nor deb has a Gatekeeper or
          # SmartScreen equivalent, so there is no certificate to provision and
          # nothing to notarize. `--publish never` still writes latest-linux.yml,
          # which the AppImage updater reads.
          bun run electron-builder --linux --x64 --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Validate release artifacts
        shell: bash
        run: |
          test -f dist-release/latest-linux.yml
          test "$(find dist-release -maxdepth 1 -name 'Navide-*.AppImage' | wc -l | tr -d ' ')" -eq 1
          test "$(find dist-release -maxdepth 1 -name 'Navide-*.deb' | wc -l | tr -d ' ')" -eq 1
          # The packaged backend must be the Linux one this job just built,
          # not a stale macOS binary that happened to be lying around.
          # Absolute path: the extraction below runs from a temp directory.
          appimage="${PWD}/$(find dist-release -maxdepth 1 -name 'Navide-*.AppImage' -print -quit)"
          chmod +x "${appimage}"
          work="$(mktemp -d)"
          (cd "${work}" && "${appimage}" --appimage-extract >/dev/null)
          backend="$(find "${work}/squashfs-root/resources/bin" -maxdepth 1 -name 'agent_team_backend' -print -quit)"
          test -n "${backend}"
          file "${backend}" | grep -q 'ELF 64-bit'
          # …and the exact selected v2 factory package carries its Linux backend.
          artifact_version="$(node -p "require('./package.json').version")"
          test -x "${work}/squashfs-root/resources/official-artifacts/navide.plans/${artifact_version}/linux-x64/package/backend/navide-plans"
          rm -rf "${work}"

      - name: Attach installers to the workflow run
        # Every run, including a workflow_dispatch dry run: this is how a
        # Linux build gets tried on a real desktop before a tag publishes it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navide-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-release/Navide-*.AppImage
            dist-release/Navide-*.deb
            dist-release/latest-linux.yml

      - name: Upload to the draft GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(find dist-release -maxdepth 1 -type f \( -name 'Navide-*.AppImage' -o -name 'Navide-*.deb' -o -name 'latest-linux.yml' \) -print0)
          test "${#assets[@]}" -eq 3
          # The macOS job normally created the draft already; the create
          # branch only fires on a manual rerun of this job alone.
          scripts/publish-release-assets.sh "${GITHUB_REF_NAME}" "${assets[@]}"

  smoke-linux-x64:
    # The job above only proves the installers build. This one installs each
    # of them on a clean desktop-class runner, starts the app under a virtual
    # display, waits for the bundled backend, and has the backend's own MCP
    # server open a terminal pane and run a command in it — the first time an
    # x64 Linux build is actually opened before it ships. On a tag push the
    # mirror and the publish wait for it, so a build that cannot start stays
    # a draft.
    if: github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    name: Launch packaged Linux x64 (${{ matrix.format }})
    needs: release-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: appimage
            pattern: Navide-*.AppImage
          - format: deb
            pattern: Navide-*.deb

    steps:
      - name: Check out the smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Download the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navide-linux-x64
          path: dist-release

      - name: Install the virtual display and FUSE
        # The AppImage runtime is the static type2 one: it links no libfuse
        # and only needs fusermount3, from fuse3. That mirrors what a stock
        # Ubuntu 24.04 desktop already has; libfuse2 is deliberately absent so
        # a regression back to a FUSE 2 runtime fails here, as it would for
        # users.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fuse3

      - name: Open the packaged app and run a command in a pane
        run: |
          installer="$(find dist-release -maxdepth 1 -name '${{ matrix.pattern }}' -print -quit)"
          test -n "${installer}"
          python3 scripts/linux-packaged-smoke.py --${{ matrix.format }} "${installer}"

  package-linux-arm64:
    # Manual dry runs only: this build exists so the Linux port can be tried
    # in an arm64 VM on Apple silicon, where the x64 binaries cannot run. It
    # is never published, so it does not wait on the macOS job.
    if: github.event_name == 'workflow_dispatch'
    name: Package Linux arm64 (dry run only)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment:
      name: production
      url: https://github.com/Navide-dev/Navide/releases/latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        # Runs install, typecheck, test, build and electron-builder. The version
        # is pinned in .bun-version; the action pin is the one ci.yml uses.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Node.js
        # Only for the plain `node scripts/...` and `node -p` steps below, which
        # are release checks and post-processing outside package.json. Everything
        # started through `bun run` runs on Bun itself (bunfig.toml [run] bun).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: package-linux-arm64

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked

      - name: Run Linux release gates
        # Same OS-level gates as the x64 job, on the arm64 kernel: the backend
        # suite, and the smoke test that opens a real PTY, reads /proc, and
        # serves /health.
        run: |
          uv --project backend run --locked ruff check backend
          uv --project backend run --locked pytest backend/tests
          uv --project backend run --locked python backend/linux_smoke.py

      - name: Build Python backend
        # PyInstaller cannot cross-compile; an arm64 backend binary can only
        # come from an arm64 runner.
        working-directory: backend
        run: uv run --locked pyinstaller agent_team_backend.spec

      - name: Set up Rust
        # Best-effort on this runner: never block the release on the sidecar.
        continue-on-error: true
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/navide-stt

      - name: Build speech-to-text sidecar
        continue-on-error: true
        # Compiles whisper.cpp (cmake) into build/stt/, which electron-builder
        # packages as bin/navide-stt. Best-effort here: on failure the script
        # warns and the build ships without it (voice input shows as unavailable).
        shell: bash
        env:
          NAVIDE_STT_REQUIRED: '0'
        run: bun run build:stt

      - name: Build application
        shell: bash
        run: |
          bun run build
          test -f dist-plugins/plans/index.html
          test ! -e dist-plugins/plans/backend/navide-plans
          test ! -e dist-plugins/plans/backend/navide-plans-go
          node scripts/verify-plans-production.mjs
          # No signing on Linux: neither AppImage nor deb has a Gatekeeper or
          # SmartScreen equivalent, so there is no certificate to provision and
          # nothing to notarize. `--publish never` still writes latest-linux.yml,
          # which the AppImage updater reads.
          bun run electron-builder --linux --arm64 --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Validate release artifacts
        shell: bash
        run: |
          ls -l dist-release
          # electron-builder names the arm64 update manifest by arch.
          test -f dist-release/latest-linux-arm64.yml
          test "$(find dist-release -maxdepth 1 -name 'Navide-*.AppImage' | wc -l | tr -d ' ')" -eq 1
          test "$(find dist-release -maxdepth 1 -name 'Navide-*.deb' | wc -l | tr -d ' ')" -eq 1
          # The packaged backend must be the Linux one this job just built,
          # not a stale macOS binary that happened to be lying around.
          # Absolute path: the extraction below runs from a temp directory.
          appimage="${PWD}/$(find dist-release -maxdepth 1 -name 'Navide-*.AppImage' -print -quit)"
          chmod +x "${appimage}"
          work="$(mktemp -d)"
          (cd "${work}" && "${appimage}" --appimage-extract >/dev/null)
          backend="$(find "${work}/squashfs-root/resources/bin" -maxdepth 1 -name 'agent_team_backend' -print -quit)"
          test -n "${backend}"
          file "${backend}" | grep -q 'ELF 64-bit.*aarch64'
          # …and the selected v2 Plans package carries its Linux backend.
          artifact_version="$(node -p "require('./package.json').version")"
          test -x "${work}/squashfs-root/resources/official-artifacts/navide.plans/${artifact_version}/linux-arm64/package/backend/navide-plans"
          rm -rf "${work}"

      - name: Attach installers to the workflow run
        # The only output of this job.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navide-linux-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-release/Navide-*.AppImage
            dist-release/Navide-*.deb
            dist-release/latest-linux-arm64.yml

  release-windows-gates:
    if: github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    name: Windows release gates (${{ matrix.arch }}, ${{ matrix.shard }})
    # The complete backend suite on each Windows kernel a release ships for,
    # split with the same `--shard K/N` CI uses: the K/N shards partition the
    # collected suite, so the four legs of one arch together run all of it.
    # Unsplit inside the packaging job it took 64 min on x64 in v0.2.20 and
    # grows with every test; four legs that start with the run, beside the
    # macOS job, keep each one far from its timeout and off the serial chain.
    # No secrets and no environment: nothing here builds or publishes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, shard: 1/4, timeout: 45 }
          - { arch: x64, runner: windows-latest, shard: 2/4, timeout: 45 }
          - { arch: x64, runner: windows-latest, shard: 3/4, timeout: 45 }
          - { arch: x64, runner: windows-latest, shard: 4/4, timeout: 45 }
          # arm64 compiles httptools and watchdog from their sdists first.
          - { arch: arm64, runner: windows-11-arm, shard: 1/4, timeout: 60 }
          - { arch: arm64, runner: windows-11-arm, shard: 2/4, timeout: 60 }
          - { arch: arm64, runner: windows-11-arm, shard: 3/4, timeout: 60 }
          - { arch: arm64, runner: windows-11-arm, shard: 4/4, timeout: 60 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: release-windows-gates-${{ matrix.arch }}

      - name: Install dependencies
        run: uv --project backend sync --locked

      - name: Run Windows release gates
        # The platform-independent frontend gates run in the macOS job; what is
        # worth repeating is the backend suite on this kernel, where the
        # process, path and signal seams differ most — and on arm64, the first
        # thing that would notice a dependency that only pretends to have an
        # arm64 build. Run bare, as before: the watchdog flags CI adds are what
        # hung the step there (see backend/ci_windows_tests.py).
        run: |
          uv --project backend run --locked ruff check backend
          uv --project backend run --locked pytest backend/tests --shard ${{ matrix.shard }}

  release-windows-x64:
    if: github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    name: Package and release Windows x64
    # Serialised behind macOS for the same reason the Linux job is: the
    # release is created once and joined by the other platforms' assets.
    # Nothing is packaged until every Windows gate shard, x64 and arm64, passed.
    needs: [release-macos-arm64, release-windows-gates]
    runs-on: windows-latest
    # Dry runs take 38-40 min; v0.2.18 was cancelled at 45 while still
    # building, and v0.2.20 at 75 after its unsharded backend gate alone took
    # 64 min, so leave real headroom.
    timeout-minutes: 120
    environment:
      name: production
      url: https://github.com/Navide-dev/Navide/releases/latest
    # Git-for-Windows bash on every step, so the Linux job's shell idioms
    # (find/wc/test, arrays, process substitution) carry over unchanged.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        # Runs install, typecheck, test, build and electron-builder. The version
        # is pinned in .bun-version; the action pin is the one ci.yml uses.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Node.js
        # Only for the plain `node scripts/...` and `node -p` steps below, which
        # are release checks and post-processing outside package.json. Everything
        # started through `bun run` runs on Bun itself (bunfig.toml [run] bun).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: release-windows

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked

      - name: Verify tag and version sources
        if: github.event_name == 'push'
        run: bun run release:check "${GITHUB_REF_NAME}"

      - name: Build Python backend
        # PyInstaller cannot cross-compile; this is the only place a Windows
        # backend exe is ever produced.
        working-directory: backend
        run: uv run --locked pyinstaller agent_team_backend.spec

      - name: Verify the frozen backend can open a ConPTY
        # The unit tests only see what the spec collects; they cannot see
        # whether the bootloader extracts winpty's OpenConsole.exe so conpty.dll
        # finds it at runtime. This spawns a real ConPTY inside the FROZEN exe:
        # a build that dropped OpenConsole.exe exits every pane at once with
        # STATUS_CONTROL_C_EXIT, so this step goes red before that ever ships.
        run: backend/dist/agent_team_backend.exe --self-check conpty

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/navide-stt

      - name: Build speech-to-text sidecar
        # Compiles whisper.cpp (cmake) into build/stt/, which electron-builder
        # packages as bin/navide-stt. Required here: a release without it silently
        # loses voice input.
        shell: bash
        env:
          NAVIDE_STT_REQUIRED: '1'
        run: bun run build:stt

      - name: Build application
        run: |
          bun run build
          test -f dist-plugins/plans/index.html
          test ! -e dist-plugins/plans/backend/navide-plans
          test ! -e dist-plugins/plans/backend/navide-plans-go
          node scripts/verify-plans-production.mjs
          # No signing yet: there is no Windows code-signing certificate, so
          # SmartScreen will warn on first run and electron-updater installs
          # updates without verifying a signature. `--publish never` still
          # writes latest.yml, which the NSIS updater reads.
          # electron-builder runs under Node on Windows: under Bun it hangs after
          # the icons-bundle download, in the step that edits Navide.exe's
          # resources (dry run 39303269789). Install and build stay on Bun.
          node node_modules/electron-builder/cli.js --win --x64 --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Validate release artifacts
        run: |
          test -f dist-release/latest.yml
          test "$(find dist-release -maxdepth 1 -name 'Navide-*-win-x64.exe' | wc -l | tr -d ' ')" -eq 1
          # The packaged backend must be the Windows exe this job just built,
          # and the v2 Plans package must carry its Windows backend. `test -f`
          # rather than `-x`: the executable bit means nothing on NTFS.
          test -f dist-release/win-unpacked/resources/bin/agent_team_backend.exe
          artifact_version="$(node -p "require('./package.json').version")"
          test -f "dist-release/win-unpacked/resources/official-artifacts/navide.plans/${artifact_version}/win32-x64/package/backend/navide-plans.exe"

      - name: Attach installers to the workflow run
        # Every run, including a workflow_dispatch dry run: this is how a
        # Windows build gets tried on a real desktop before a tag publishes it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navide-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-release/Navide-*-win-x64.exe
            dist-release/Navide-*-win-x64.exe.blockmap
            dist-release/latest.yml

      - name: Upload to the draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(find dist-release -maxdepth 1 -type f \( -name 'Navide-*-win-x64.exe' -o -name 'Navide-*-win-x64.exe.blockmap' -o -name 'latest.yml' \) -print0)
          # installer + latest.yml at least; the blockmap joins when produced.
          test "${#assets[@]}" -ge 2
          # The macOS job normally created the draft already; the create
          # branch only fires on a manual rerun of this job alone.
          scripts/publish-release-assets.sh "${GITHUB_REF_NAME}" "${assets[@]}"

  release-windows-arm64:
    if: github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    name: Package and release Windows arm64
    # Behind the x64 job rather than beside it, for two reasons. The release is
    # created once and joined by the other platforms' assets, as on Linux; and
    # Windows is the one platform with no per-arch update manifest, so this job
    # has to read the x64 `latest.yml` and add itself to it instead of
    # publishing a second file of the same name over the top.
    needs: release-windows-x64
    runs-on: windows-11-arm
    # Longer than the x64 job's: two of the backend's dependencies publish
    # no win_arm64 wheel (httptools, watchdog) and are compiled from their
    # sdists here. Dry runs take 46-54 min, too close to the old 60; the
    # backend gate grew past an hour on x64 in v0.2.20, so this one gets more.
    timeout-minutes: 150
    environment:
      name: production
      url: https://github.com/Navide-dev/Navide/releases/latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        # Runs install, typecheck, test, build and electron-builder. The version
        # is pinned in .bun-version; the action pin is the one ci.yml uses.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Node.js
        # Only for the plain `node scripts/...` and `node -p` steps below, which
        # are release checks and post-processing outside package.json. Everything
        # started through `bun run` runs on Bun itself (bunfig.toml [run] bun).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: release-windows-arm64

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked

      - name: Verify tag and version sources
        if: github.event_name == 'push'
        run: bun run release:check "${GITHUB_REF_NAME}"

      - name: Build Python backend
        # PyInstaller cannot cross-compile, so an arm64 backend exe exists only
        # if an arm64 runner built it. This is the whole reason the job exists:
        # everything else could have been produced on the x64 runner.
        working-directory: backend
        run: uv run --locked pyinstaller agent_team_backend.spec

      - name: Verify the frozen backend can open a ConPTY
        # The same gate the x64 job runs, for the same CRITICAL: a build that
        # failed to collect winpty's OpenConsole.exe kills every pane the
        # moment it opens, and nothing but a real ConPTY inside the frozen exe
        # can see it. Native arm64 is a fresh chance to get that wrong.
        run: backend/dist/agent_team_backend.exe --self-check conpty

      - name: Set up Rust
        # Best-effort on this runner: never block the release on the sidecar.
        continue-on-error: true
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/navide-stt

      - name: Build speech-to-text sidecar
        continue-on-error: true
        # Compiles whisper.cpp (cmake) into build/stt/, which electron-builder
        # packages as bin/navide-stt. Best-effort here: on failure the script
        # warns and the build ships without it (voice input shows as unavailable).
        shell: bash
        env:
          NAVIDE_STT_REQUIRED: '0'
        run: bun run build:stt

      - name: Build application
        run: |
          bun run build
          test -f dist-plugins/plans/index.html
          test ! -e dist-plugins/plans/backend/navide-plans
          test ! -e dist-plugins/plans/backend/navide-plans-go
          node scripts/verify-plans-production.mjs
          # Unsigned for the same reason the x64 build is: there is no Windows
          # code-signing certificate yet.
          # electron-builder runs under Node on Windows: under Bun it hangs after
          # the icons-bundle download, in the step that edits Navide.exe's
          # resources (dry run 39303269789). Install and build stay on Bun.
          node node_modules/electron-builder/cli.js --win --arm64 --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Validate release artifacts
        run: |
          ls -l dist-release
          # Not latest-win-arm64.yml: app-builder-lib suffixes the update
          # manifest by architecture for Linux only, so this is `latest.yml`
          # too, and the publish step below merges it into the x64 one.
          test -f dist-release/latest.yml
          test "$(find dist-release -maxdepth 1 -name 'Navide-*-win-arm64.exe' | wc -l | tr -d ' ')" -eq 1
          test -f dist-release/win-arm64-unpacked/resources/bin/agent_team_backend.exe
          artifact_version="$(node -p "require('./package.json').version")"
          plans_backend="dist-release/win-arm64-unpacked/resources/official-artifacts/navide.plans/${artifact_version}/win32-arm64/package/backend/navide-plans.exe"
          test -f "${plans_backend}"
          # The point of this job is a native build, and an installer whose
          # payload is quietly x64 would run anyway — under Prism, exactly what
          # we are trying to stop. The COFF headers are the only witness.
          node scripts/check-pe-machine.mjs arm64 \
            dist-release/win-arm64-unpacked/Navide.exe \
            dist-release/win-arm64-unpacked/resources/bin/agent_team_backend.exe \
            "${plans_backend}"

      - name: Fetch the x64 update manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navide-windows-x64
          path: dist-x64

      - name: Merge this build into the Windows update manifest
        # electron-updater reads one `latest.yml` for both Windows arches and
        # picks the installer whose URL contains process.arch, so the published
        # manifest has to list x64 and arm64 together.
        run: |
          node scripts/merge-windows-update-manifest.mjs \
            dist-x64/latest.yml dist-release/latest.yml dist-release/latest.yml
          cat dist-release/latest.yml

      - name: Attach installers to the workflow run
        # Every run, including a workflow_dispatch dry run: a Windows on Arm
        # desktop is where this build has to be tried before a tag ships it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navide-windows-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-release/Navide-*-win-arm64.exe
            dist-release/Navide-*-win-arm64.exe.blockmap
            dist-release/latest.yml

      - name: Upload to the draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(find dist-release -maxdepth 1 -type f \( -name 'Navide-*-win-arm64.exe' -o -name 'Navide-*-win-arm64.exe.blockmap' -o -name 'latest.yml' \) -print0)
          # installer + latest.yml at least; the blockmap joins when produced.
          test "${#assets[@]}" -ge 2
          # --clobber replaces the x64 job's latest.yml with the merged one it
          # was built from; this job runs after that one, so there is no race.
          # Once the release is published, the script keeps its latest.yml.
          scripts/publish-release-assets.sh "${GITHUB_REF_NAME}" "${assets[@]}"

  mirror-release:
    # Runs after every platform has joined the draft GitHub Release, and copies
    # the finished draft to the S3 bucket behind dl.navide.dev (the steps live
    # in mirror.yml so a past release can be backfilled by hand). Reading the
    # assets back from GitHub rather than from each job's dist-release means
    # the mirror carries exactly what GitHub will serve — including the
    # Windows latest.yml after the arm64 job merged itself into it.
    if: github.event_name == 'push' && github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    needs: [release-macos-arm64, release-linux-x64, smoke-linux-x64, release-windows-arm64]
    uses: ./.github/workflows/mirror.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish-release:
    # The only step that makes the release public. It waits for every platform
    # job and for a verified mirror, so the mirror (the updater's feed and the
    # website's first choice) and GitHub go live together and nobody ever sees
    # a release missing a platform. release-windows-x64 is listed although
    # release-windows-arm64 already implies it, so the dependency is explicit.
    # Any failure upstream skips this job and leaves the release a draft; a
    # "Re-run failed jobs" on the run finishes it once the cause is fixed.
    if: github.event_name == 'push' && github.ref_name != 'v0.1.40' && github.ref_name != 'v0.1.41' && github.ref_name != 'v0.1.49'
    needs: [release-macos-arm64, release-linux-x64, smoke-linux-x64, release-windows-gates, release-windows-x64, release-windows-arm64, mirror-release]
    name: Publish the GitHub Release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Publish the draft as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: publishing an already-published release only re-marks
          # it Latest. A rerun of an old tag's run after a newer version
          # shipped publishes without taking Latest back from that version
          # (the mirror job left releases/latest/ alone for the same reason).
          is_latest="$(scripts/release-latest-guard.sh "${GITHUB_REF_NAME}")"
          if [ "${is_latest}" = true ]; then
            latest_flag=--latest
          else
            echo "::notice::${GITHUB_REF_NAME} is published but not marked Latest; a newer release already is"
            latest_flag=--latest=false
          fi
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false "${latest_flag}"
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = false
