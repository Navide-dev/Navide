name: Mirror release

# Copies one GitHub Release, byte for byte, to the S3 bucket behind
# dl.navide.dev. release.yml calls this after every platform has uploaded to
# the draft release, and publishes the release only once this has passed;
# the manual trigger backfills a release that shipped before the mirror
# existed, or re-runs one whose mirror job failed.
#
# releases/<tag>/ is the permanent, immutable copy the website links to;
# releases/latest/ is overwritten every release so electron-updater's generic
# provider can read latest*.yml (and the files they name) from one fixed URL
# — unless a newer release is already Latest (a rerun of an old tag's run).
# The CloudFront behavior for releases/latest/* caches for 60 s; the
# invalidation just makes the switch immediate.
#
# Beside the release files, both prefixes get whats-new.json: the in-app
# announcements up to this release (scripts/export-whats-new.mjs), which the
# website's /news page reads. Format: docs/en-US/release-announcements.md.
# It is best effort: its steps run apart from the installer steps and only
# warn when they fail, because the installers matter more than the notes.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to mirror (v0.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (v0.2.3)
        required: true
        type: string
      refresh_latest:
        description: Also replace releases/latest/ with this tag (off when backfilling an older release)
        required: false
        type: boolean
        default: false

# write, although this workflow only reads: release.yml calls it while the
# release is still a draft, and GitHub lists draft releases (which is how
# `gh release download` resolves one by tag) only to a token that can push.
# A reusable workflow's own permissions cap the caller's, so `read` here would
# hide the draft and fail the download.
permissions:
  contents: write

jobs:
  mirror:
    name: Mirror ${{ inputs.tag }} to dl.navide.dev
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.NAVIDE_MIRROR_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NAVIDE_MIRROR_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
      MIRROR_BUCKET: navide-releases
      MIRROR_DISTRIBUTION: E3QHTAL965EQZS
      TAG: ${{ inputs.tag }}
      # A release run always refreshes latest/; a manual run only when asked.
      REFRESH_LATEST: ${{ github.event_name == 'workflow_call' || github.event_name == 'push' || inputs.refresh_latest == true }}
    steps:
      # First: checkout empties a workspace that is not yet a repository, so
      # it cannot run after mirror/ has been downloaded.
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # whatsNew.ts and CHANGELOG.md feed whats-new.json.
          sparse-checkout: |
            scripts
            src/renderer/src/lib
            CHANGELOG.md

      - name: Set up Node.js
        # For whats-new.json only, so its failure must not stop the mirror.
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify mirror credentials
        run: |
          aws sts get-caller-identity --query Arn --output text
          # s3api, not `s3 ls`: the latter exits 1 on an empty prefix, which
          # is exactly what the very first mirror run sees.
          aws s3api list-objects-v2 --bucket "${MIRROR_BUCKET}" --prefix releases/ \
            --max-keys 50 --query 'Contents[].Key' --output text

      - name: Download the release (a draft when called by release.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mirror
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir mirror
          # Every platform's files must be present before anything is mirrored:
          # a partial mirror would send website visitors to 404s.
          for expected in latest-mac.yml latest-linux.yml latest.yml; do
            test -f "mirror/${expected}"
          done
          ls -la mirror
          (cd mirror && sha256sum -- * > "../${TAG}.sha256")
          cat "${TAG}.sha256"

      - name: Export the announcements as whats-new.json
        id: whats_new_export
        continue-on-error: true
        run: |
          # Kept out of mirror/ so the checksum list stays exactly GitHub's
          # files; entries newer than the tag are left out.
          node --experimental-strip-types scripts/export-whats-new.mjs --version "${TAG}" --out whats-new.json

      - name: Upload to releases/<tag>/
        run: |
          # Content-Type is set explicitly: S3 would otherwise guess from the
          # extension and serve latest*.yml as text/yaml with a charset, which
          # electron-updater tolerates but browsers then try to render.
          aws s3 sync mirror "s3://${MIRROR_BUCKET}/releases/${TAG}/" \
            --exclude '*' --include '*.yml' --content-type 'application/x-yaml' --no-progress
          aws s3 sync mirror "s3://${MIRROR_BUCKET}/releases/${TAG}/" \
            --exclude '*.yml' --content-type 'application/octet-stream' --no-progress
          aws s3 cp "${TAG}.sha256" "s3://${MIRROR_BUCKET}/releases/${TAG}/SHA256SUMS" \
            --content-type 'text/plain' --no-progress

      - name: Verify the mirror serves what GitHub serves
        run: |
          # Compare the mirrored bytes against the sha256 taken from the GitHub
          # download above; a mismatch fails the job and leaves GitHub as the
          # website's only working link (the site probes before it links).
          # It runs before releases/latest/ is replaced, so a failed check
          # never reaches the updater's feed either.
          mkdir -p check && cd check
          while read -r _ name; do
            curl -fsSL --retry 3 -o "${name}" "https://dl.navide.dev/releases/${TAG}/${name}"
          done < "../${TAG}.sha256"
          sha256sum -c "../${TAG}.sha256"

      - name: Refuse to move releases/latest/ back to an older release
        id: latest_guard
        # Re-running an old tag's release run after a newer version shipped
        # must not hand the updater's feed back to the old version. A manual
        # run with refresh_latest=true skips this check: that is the rollback
        # path (see RELEASING.md "Rollback"), where going back is the point.
        if: env.REFRESH_LATEST == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_latest="$(scripts/release-latest-guard.sh "${TAG}")"
          echo "is_latest=${is_latest}" >> "${GITHUB_OUTPUT}"
          if [ "${is_latest}" != true ]; then
            echo "::notice::releases/latest/ is left as it is; ${TAG} is older than the current Latest release"
          fi

      - name: Replace releases/latest/
        id: replace_latest
        if: env.REFRESH_LATEST == 'true' && steps.latest_guard.outputs.is_latest != 'false'
        run: |
          # latest/ is replaced wholesale: --delete drops the previous
          # version's binaries so the prefix never mixes two releases.
          aws s3 sync mirror "s3://${MIRROR_BUCKET}/releases/latest/" --delete \
            --exclude '*' --include '*.yml' --content-type 'application/x-yaml' --no-progress
          aws s3 sync mirror "s3://${MIRROR_BUCKET}/releases/latest/" --delete \
            --exclude '*.yml' --content-type 'application/octet-stream' --no-progress
          aws cloudfront create-invalidation --distribution-id "${MIRROR_DISTRIBUTION}" \
            --paths '/releases/latest/*' --query Invalidation.Id --output text

      # whats-new.json: each upload and each check is its own best-effort step,
      # so no one failure keeps another from running. latest/ in particular
      # never waits on the releases/<tag>/ check: the --delete sync above has
      # just removed latest/'s copy, and skipping the upload would leave /news
      # with nothing.
      - name: Publish whats-new.json to releases/<tag>/
        id: whats_new_publish
        if: steps.whats_new_export.outcome == 'success'
        continue-on-error: true
        run: |
          aws s3 cp whats-new.json "s3://${MIRROR_BUCKET}/releases/${TAG}/whats-new.json" \
            --content-type 'application/json' --no-progress

      - name: Publish whats-new.json to releases/latest/
        id: whats_new_latest
        # Only where latest/ now holds this release.
        if: steps.whats_new_export.outcome == 'success' && steps.replace_latest.outcome == 'success'
        continue-on-error: true
        run: |
          aws s3 cp whats-new.json "s3://${MIRROR_BUCKET}/releases/latest/whats-new.json" \
            --content-type 'application/json' --no-progress
          aws cloudfront create-invalidation --distribution-id "${MIRROR_DISTRIBUTION}" \
            --paths '/releases/latest/whats-new.json' --query Invalidation.Id --output text

      - name: Check the mirrored whats-new.json
        id: whats_new_check
        if: steps.whats_new_publish.outcome == 'success' || steps.whats_new_latest.outcome == 'success'
        continue-on-error: true
        env:
          TAG_PUBLISHED: ${{ steps.whats_new_publish.outcome == 'success' }}
          LATEST_PUBLISHED: ${{ steps.whats_new_latest.outcome == 'success' }}
        run: |
          # Each copy is checked on its own and only warns: CloudFront may still
          # serve an earlier copy for a moment (a re-run after an entry changed).
          status=0
          check() {
            if curl -fsSL --retry 3 -o whats-new.check.json "$1" && cmp -s whats-new.json whats-new.check.json; then
              echo "$1 matches"
            else
              echo "::warning::$1 does not serve the whats-new.json just exported"
              echo "⚠️ $1 does not serve the whats-new.json just exported" >> "${GITHUB_STEP_SUMMARY}"
              status=1
            fi
          }
          if [ "${TAG_PUBLISHED}" = true ]; then check "https://dl.navide.dev/releases/${TAG}/whats-new.json"; fi
          if [ "${LATEST_PUBLISHED}" = true ]; then check "https://dl.navide.dev/releases/latest/whats-new.json"; fi
          exit "${status}"

      - name: Warn when whats-new.json was not published
        if: >-
          steps.whats_new_export.outcome == 'failure' || steps.whats_new_publish.outcome == 'failure'
          || steps.whats_new_latest.outcome == 'failure'
        run: |
          message="whats-new.json was not published everywhere for ${TAG} (export: ${{ steps.whats_new_export.outcome }}, releases/${TAG}: ${{ steps.whats_new_publish.outcome }}, latest: ${{ steps.whats_new_latest.outcome }}); the installers are mirrored. Where it is missing, the website's /news page falls back to GitHub Releases until a manual mirror run publishes it."
          echo "::warning::${message}"
          echo "⚠️ ${message}" >> "${GITHUB_STEP_SUMMARY}"
